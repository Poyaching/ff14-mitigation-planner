<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitigation Planner</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="hamburger-btn" class="icon-btn" aria-label="開啟設定">☰</button>
      <button id="reset-btn">重設</button>
      <label class="topbar-toggle">
        <input type="checkbox" id="full-timeline-toggle" />
        完整時間線
      </label>
      <label class="topbar-toggle">
        間距
        <input
          id="timeline-interval-input"
          class="timeline-interval-input"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          title="完整時間線的參考時間點間隔（秒），留空或輸入無效值會自動用資源節奏算出的預設值"
        />
        秒
      </label>
      <input id="plan-name-input" class="plan-name-input" type="text" placeholder="排軸名稱" />
    </header>

    <div class="infobar">
      <span id="level-badge">Lv.70</span>
      <span id="jobs-badge">0 個職業</span>
      <span class="legend">
        <span class="legend-item"><i class="legend-swatch group-mitigation"></i>減傷</span>
        <span class="legend-item"><i class="legend-swatch group-barrier"></i>護盾</span>
        <span class="legend-item"><i class="legend-swatch group-healing"></i>治療</span>
        <span class="legend-item"><i class="legend-swatch group-other"></i>其他</span>
      </span>
      <span class="hint">
        點擊技能格排入技能，✓ 表示已排入、🔒 表示 CD 中（藍綠底＝效果仍持續中、灰底＝純等 CD）
      </span>
    </div>

    <div class="layout">
      <aside id="settings-drawer" class="settings-drawer">
        <h2>設定</h2>
        <details class="io-section">
          <summary>多人共編</summary>
          <div class="io-section-body collab-body">
            <div id="collab-login-row">
              <input id="invite-code-input" type="password" placeholder="邀請碼" autocomplete="off" />
              <div class="session-actions">
                <button id="invite-login-btn" type="button">登入</button>
              </div>
            </div>
            <button
              id="collab-account-status"
              class="collab-account-status"
              type="button"
              hidden
              title="點一下登出，可以換一組邀請碼重新登入"
            >
              <span class="status-dot"></span> <span id="collab-account-code">邀請碼</span>
            </button>
            <div id="collab-room-row" hidden>
              <input id="room-id-input" type="text" placeholder="房間代碼（隊伍自訂）" />
              <div class="session-actions">
                <button id="join-room-btn" type="button">加入</button>
                <button id="leave-room-btn" type="button" hidden>離開</button>
              </div>
            </div>
            <p id="collab-status" class="collab-status"></p>
          </div>
        </details>
        <details class="io-section">
          <summary>資料匯入匯出</summary>
          <div class="io-section-body">
            <button id="import-csv-btn">匯入機制軸</button>
            <input id="csv-file-input" type="file" accept=".csv" hidden />
            <a id="csv-template-link" class="topbar-link" href="duty-timeline-template.csv" download>機制軸範本</a>
            <button id="export-sessions-btn">匯出全部場次</button>
            <button id="import-sessions-btn">匯入單一場次</button>
            <input id="import-sessions-file-input" type="file" accept=".json" hidden />
          </div>
        </details>
        <fieldset>
          <legend>場次</legend>
          <select id="session-select"></select>
          <div class="session-actions">
            <button id="new-session-btn" type="button">新增場次</button>
            <button id="delete-session-btn" type="button">刪除此場次</button>
          </div>
        </fieldset>
        <label>
          等級
          <select id="settings-level-select">
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="80">80</option>
            <option value="90">90</option>
            <option value="100">100</option>
          </select>
        </label>
        <fieldset>
          <legend>顯示分類</legend>
          <div id="group-checkboxes"></div>
        </fieldset>
        <fieldset>
          <legend>隊伍職業</legend>
          <div id="job-checkboxes"></div>
        </fieldset>
        <button id="close-drawer-btn">關閉</button>
      </aside>
      <div id="drawer-overlay" class="drawer-overlay"></div>
      <div id="table-mask" class="table-mask" hidden><span id="table-mask-text">連線中…</span></div>

      <main class="table-wrap">
        <div id="planner-table-container"></div>
      </main>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
